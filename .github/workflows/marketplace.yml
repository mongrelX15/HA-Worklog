name: Marketplace readiness

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # GitHub currently does not identify a license on the default main branch.
          ignore: license
      - name: Report main-branch license requirement
        run: |
          echo "::warning::The license check is temporarily ignored because the license has been added only to beta. Add the chosen license to main, then remove this ignore."
          echo "HACS default catalog validation still requires the license to be recognized on the default main branch." >> "$GITHUB_STEP_SUMMARY"
